<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Все блюда | Книга рецептов</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="dishes">
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./products.html">
          <div class="brand-mark">KR</div>
          <div class="brand-copy">
            <strong>Книга рецептов</strong>
            <span>Страница всех блюд</span>
          </div>
        </a>
        <nav class="nav-links">
          <a class="nav-link" href="./products.html">Все продукты</a>
          <a class="nav-link active" href="./dishes.html">Все блюда</a>
        </nav>
      </header>

      <main class="page-grid">
        <section class="panel anchor-offset" id="create-dish">
          <h2>Создать или обновить блюдо</h2>
          <p class="panel-subtitle">
            
          </p>
          <div class="form-stack">
            <input id="d-name" placeholder="Название" />
            <input id="d-photos" type="hidden" />
            <input id="d-photos-files" type="file" accept="image/*" multiple />
            <div id="d-current-photos" class="editable-photo-list"></div>
            <div class="composition-builder">
              <div class="row-2">
                <select id="d-product-select"></select>
                <input id="d-product-amount" type="number" step="0.01" min="0.01" placeholder="Количество, г" />
              </div>
              <button id="d-add-product" type="button" class="secondary">Добавить продукт</button>
              <div id="d-composition-list" class="composition-list"></div>
            </div>
            <textarea id="d-composition" class="hidden-field"></textarea>
            <div class="row-2">
              <input id="d-portion" type="number" step="0.01" min="0.01" placeholder="Размер порции, г" />
              <select id="d-category"></select>
            </div>
            <div class="row-2">
              <input id="d-calories" type="number" step="0.1" min="0" placeholder="Ккал / порция" />
              <input id="d-proteins" type="number" step="0.1" min="0" placeholder="Белки / порция" />
              <input id="d-fats" type="number" step="0.1" min="0" placeholder="Жиры / порция" />
              <input id="d-carbs" type="number" step="0.1" min="0" placeholder="Углеводы / порция" />
            </div>
            <small id="d-macro-hint"></small>
            <div class="flags">
              <label><input type="checkbox" id="d-vegan" />Веган</label>
              <label><input type="checkbox" id="d-glutenFree" />Без глютена</label>
              <label><input type="checkbox" id="d-sugarFree" />Без сахара</label>
            </div>
            <div class="panel-actions">
              <button id="d-save">Сохранить блюдо</button>
              <button id="d-clear" type="button">Очистить форму</button>
              
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>Все блюда</h2>
          <div class="filter-stack">
            <input id="d-search" placeholder="Поиск по названию" />
            <div class="row-2">
              <select id="d-filter-category"></select>
              <select id="d-sort">
                <option value="">Без сортировки</option>
                <option value="name">Название</option>
                <option value="calories">Калорийность</option>
                <option value="proteins">Белки</option>
                <option value="fats">Жиры</option>
                <option value="carbs">Углеводы</option>
                <option value="portionSize">Порция</option>
              </select>
            </div>
            <div class="row-2">
              <div class="flags">
                <label><input type="checkbox" id="df-vegan" />Веган</label>
                <label><input type="checkbox" id="df-glutenFree" />Без глютена</label>
                <label><input type="checkbox" id="df-sugarFree" />Без сахара</label>
              </div>
            </div>
            <div class="panel-actions">
              <button id="d-refresh" type="button">Обновить список</button>
            </div>
          </div>
          <div id="dishes" class="card-stack"></div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
