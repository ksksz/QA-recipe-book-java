<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Все продукты | Книга рецептов</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="products">
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./products.html">
          <div class="brand-mark">KR</div>
          <div class="brand-copy">
            <strong>Книга рецептов</strong>
            <span>Страница всех продуктов</span>
          </div>
        </a>
        <nav class="nav-links">
          <a class="nav-link active" href="./products.html">Все продукты</a>
          <a class="nav-link" href="./dishes.html">Все блюда</a>
        </nav>
      </header>

      <main class="page-grid">
        <section class="panel anchor-offset" id="create-product">
          <h2>Создать или обновить продукт</h2>
          <p class="panel-subtitle">
          
          </p>
          <div class="form-stack">
            <input id="p-name" placeholder="Название" />
            <input id="p-photos" type="hidden" />
            <input id="p-photos-files" type="file" accept="image/*" multiple />
            <div id="p-current-photos" class="editable-photo-list"></div>
            <div class="row-2">
              <input id="p-calories" type="number" step="0.1" min="0" placeholder="Ккал / 100 г" />
              <input id="p-proteins" type="number" step="0.1" min="0" max="100" placeholder="Белки / 100 г" />
              <input id="p-fats" type="number" step="0.1" min="0" max="100" placeholder="Жиры / 100 г" />
              <input id="p-carbs" type="number" step="0.1" min="0" max="100" placeholder="Углеводы / 100 г" />
            </div>
            <textarea id="p-composition" placeholder="Состав продукта"></textarea>
            <select id="p-category"></select>
            <select id="p-cooking"></select>
            <div class="flags">
              <label><input type="checkbox" id="p-vegan" />Веган</label>
              <label><input type="checkbox" id="p-glutenFree" />Без глютена</label>
              <label><input type="checkbox" id="p-sugarFree" />Без сахара</label>
            </div>
            <div class="panel-actions">
              <button id="p-save">Сохранить продукт</button>
              <button id="p-clear" type="button">Очистить форму</button>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>Все продукты</h2>
          <p class="panel-subtitle"></p>
          <div class="filter-stack">
            <input id="p-search" placeholder="Поиск по названию" />
            <div class="row-3">
              <select id="p-filter-category"></select>
              <select id="p-filter-cooking"></select>
              <select id="p-sort">
                <option value="">Без сортировки</option>
                <option value="name">Название</option>
                <option value="calories">Калорийность</option>
                <option value="proteins">Белки</option>
                <option value="fats">Жиры</option>
                <option value="carbs">Углеводы</option>
              </select>
            </div>
            <div class="flags">
              <label><input type="checkbox" id="pf-vegan" />Веган</label>
              <label><input type="checkbox" id="pf-glutenFree" />Без глютена</label>
              <label><input type="checkbox" id="pf-sugarFree" />Без сахара</label>
            </div>
            <div class="panel-actions">
              <button id="p-refresh" type="button">Обновить список</button>
            </div>
          </div>
          <div id="products" class="card-stack"></div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
